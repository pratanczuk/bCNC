name: Classic regression tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install virtual display and application
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-tk libgl1 fonts-dejavu-core
          python -m pip install -c packaging/constraints.txt . -r requirements-test.txt
      - name: Test the plotter workflow without hardware
        run: xvfb-run -a python -W ignore::ResourceWarning -m coverage run --source=bCNC -m unittest discover -s tests
      - name: Enforce UI coverage above 90 percent
        run: python tools/check_gui_coverage.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: classic-test-evidence
          path: |
            artifacts/coverage/
            htmlcov/
          retention-days: 14
